        if ($existing) {
          if ($existing.Status -ne 'Stopped') { Stop-Service -Name $serviceName -Force }
          (Get-Service -Name $serviceName).WaitForStatus('Stopped', [TimeSpan]::FromSeconds(60))
        }
        New-Item -ItemType Directory -Path $target -Force | Out-Null
        Expand-Archive -LiteralPath $zip -DestinationPath $target -Force
        $exe = Join-Path $target 'TransactionProcessing.MerchantPos.exe'
        if (-not (Test-Path $exe)) { throw "Service executable missing: $exe" }
        if (-not $existing) {
          New-Service -Name $serviceName -BinaryPathName ('"' + $exe + '"') -DisplayName $serviceName -Description $serviceName -StartupType Automatic
        } else {
          sc.exe config $serviceName binPath= ('"' + $exe + '"') | Out-Host
          if ($LASTEXITCODE -ne 0) { throw 'Failed to update service path' }
        }
        Start-Service -Name $serviceName
        (Get-Service -Name $serviceName).WaitForStatus('Running', [TimeSpan]::FromSeconds(60))
