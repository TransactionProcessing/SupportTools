  build-scheduled-tasks:
    name: Build ScheduledTasks
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Install .NET 11
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: 11.0.x
    - name: Publish KurrentDB client
      run: dotnet publish "ScheduledTasks/DailySupportCheck/KurrentDbClient/KurrentDbClient.csproj" --configuration Release --output "ScheduledTasks/DailySupportCheck/KurrentDbClient/publishOutput"
        --no-self-contained
    - name: Download PowerShell 7.7 for scheduled tasks
      run: |
        curl --fail --location --silent --show-error --retry 3 \
          --output ScheduledTasks/PowerShell-7.7.0-win-x64.zip \
          https://github.com/PowerShell/PowerShell/releases/download/v7.7.0/PowerShell-7.7.0-win-x64.zip
    - name: Upload ScheduledTasks
      uses: actions/upload-artifact@v4
      with:
        name: scheduledtasks
        path: ScheduledTasks
    if: ${{ github.event_name == 'release' || inputs.component == 'all' || inputs.component == 'scheduled-tasks' }}
    env:
      RELEASE_VERSION: ${{ github.event_name == 'release' && github.event.release.tag_name || format('0.0.{0}', github.run_number) }}
  deploy-scheduled-tasks-staging:
    name: Deploy ScheduledTasks to Staging
    runs-on:
    - stagingserver
    - windows
    needs:
    - build-scheduled-tasks
    environment: staging
    steps:
    - name: Download ScheduledTasks
      uses: actions/download-artifact@v4
      with:
        name: scheduledtasks
        path: ${{ runner.temp }}\scheduledtasks
    - name: Install scheduled tasks
      shell: powershell
      env:
        SCHEDULED_TASK_USER: ${{ secrets.SCHEDULED_TASK_USER }}
        SCHEDULED_TASK_PASSWORD: ${{ secrets.SCHEDULED_TASK_PASSWORD }}
      run: |
        $taskScriptDir = 'C:\txnproc\transactionprocessing\powershell'
        $scheduledTasksDownloadRoot = Join-Path $env:RUNNER_TEMP 'scheduledtasks'
        $scheduledTasksRoot = Join-Path $scheduledTasksDownloadRoot 'ScheduledTasks'

        if (-not (Test-Path $scheduledTasksRoot)) {
          $scheduledTasksRoot = $scheduledTasksDownloadRoot
        }

        & (Join-Path $scheduledTasksRoot 'Install-ScheduledTaskPowerShell.ps1')

        New-Item -ItemType Directory -Path $taskScriptDir -Force | Out-Null

        Get-ChildItem -Path $scheduledTasksRoot -Recurse -Filter *.ps1 |
          Where-Object { $_.FullName -notmatch '\\Tests\\' -and $_.Name -ne 'Install-ScheduledTaskPowerShell.ps1' } |
          Copy-Item -Destination $taskScriptDir -Force

        Get-ChildItem -Path $scheduledTasksRoot -Recurse -Filter daily-support-check.json |
          Where-Object { $_.FullName -notmatch '\\Reports\\|\\Tests\\' } |
          Copy-Item -Destination $taskScriptDir -Force

        $kurrentDbClientOutput = Get-ChildItem -Path $scheduledTasksRoot -Recurse -Directory -Filter publishOutput |
          Where-Object { $_.FullName -match '\\DailySupportCheck\\KurrentDbClient\\publishOutput$' } |
          Select-Object -First 1
        if (-not $kurrentDbClientOutput) {
          throw 'Packaged KurrentDB client output was not found in the scheduled-tasks artifact.'
        }
        $kurrentDbClientDestination = Join-Path $taskScriptDir 'KurrentDbClient'
        New-Item -ItemType Directory -Path $kurrentDbClientDestination -Force | Out-Null
        Copy-Item -Path (Join-Path $kurrentDbClientOutput.FullName '*') -Destination $kurrentDbClientDestination -Recurse -Force

        Get-ChildItem -Path $scheduledTasksRoot -Recurse -Filter *.xml |
          Where-Object { $_.FullName -notmatch '\\Tests\\' } |
          ForEach-Object {
            [xml]$taskDefinition = Get-Content -Path $_.FullName -Raw
            $taskName = [string]$taskDefinition.Task.RegistrationInfo.URI

            if ([string]::IsNullOrWhiteSpace($taskName)) {
              $taskName = $_.BaseName
            }

            $taskName = $taskName.TrimStart('\')
            & schtasks.exe /Create /TN $taskName /XML $_.FullName /RU SYSTEM /F
            if ($LASTEXITCODE -ne 0) {
              throw "Failed to register scheduled task [$taskName] from [$($_.FullName)]"
            }
          }
  deploy-scheduled-tasks-production:
    name: Deploy ScheduledTasks to Production
    runs-on:
    - productionserver
    - windows
    needs:
    - deploy-scheduled-tasks-staging
    environment: production
    steps:
    - name: Download ScheduledTasks
      uses: actions/download-artifact@v4
      with:
        name: scheduledtasks
        path: ${{ runner.temp }}\scheduledtasks
    - name: Install scheduled tasks
      shell: powershell
      env:
        SCHEDULED_TASK_USER: ${{ secrets.SCHEDULED_TASK_USER }}
        SCHEDULED_TASK_PASSWORD: ${{ secrets.SCHEDULED_TASK_PASSWORD }}
      run: |
        $taskScriptDir = 'C:\txnproc\transactionprocessing\powershell'
        $scheduledTasksDownloadRoot = Join-Path $env:RUNNER_TEMP 'scheduledtasks'
        $scheduledTasksRoot = Join-Path $scheduledTasksDownloadRoot 'ScheduledTasks'

        if (-not (Test-Path $scheduledTasksRoot)) {
          $scheduledTasksRoot = $scheduledTasksDownloadRoot
        }

        & (Join-Path $scheduledTasksRoot 'Install-ScheduledTaskPowerShell.ps1')

        New-Item -ItemType Directory -Path $taskScriptDir -Force | Out-Null

        Get-ChildItem -Path $scheduledTasksRoot -Recurse -Filter *.ps1 |
          Where-Object { $_.FullName -notmatch '\\Tests\\' -and $_.Name -ne 'Install-ScheduledTaskPowerShell.ps1' } |
          Copy-Item -Destination $taskScriptDir -Force

        Get-ChildItem -Path $scheduledTasksRoot -Recurse -Filter daily-support-check.json |
          Where-Object { $_.FullName -notmatch '\\Reports\\|\\Tests\\' } |
          Copy-Item -Destination $taskScriptDir -Force

        $kurrentDbClientOutput = Get-ChildItem -Path $scheduledTasksRoot -Recurse -Directory -Filter publishOutput |
          Where-Object { $_.FullName -match '\\DailySupportCheck\\KurrentDbClient\\publishOutput$' } |
          Select-Object -First 1
        if (-not $kurrentDbClientOutput) {
          throw 'Packaged KurrentDB client output was not found in the scheduled-tasks artifact.'
        }
        $kurrentDbClientDestination = Join-Path $taskScriptDir 'KurrentDbClient'
        New-Item -ItemType Directory -Path $kurrentDbClientDestination -Force | Out-Null
        Copy-Item -Path (Join-Path $kurrentDbClientOutput.FullName '*') -Destination $kurrentDbClientDestination -Recurse -Force

        Get-ChildItem -Path $scheduledTasksRoot -Recurse -Filter *.xml |
          Where-Object { $_.FullName -notmatch '\\Tests\\' } |
          ForEach-Object {
            [xml]$taskDefinition = Get-Content -Path $_.FullName -Raw
            $taskName = [string]$taskDefinition.Task.RegistrationInfo.URI

            if ([string]::IsNullOrWhiteSpace($taskName)) {
              $taskName = $_.BaseName
            }

            $taskName = $taskName.TrimStart('\')
            & schtasks.exe /Create /TN $taskName /XML $_.FullName /RU SYSTEM /F
            if ($LASTEXITCODE -ne 0) {
              throw "Failed to register scheduled task [$taskName] from [$($_.FullName)]"
            }
          }
  build-sql-agent-tool:
    name: Build SQL Agent Job Deployment Tool
    runs-on: windows-latest
    steps:
    - uses: actions/checkout@v4
    - name: Install NET 11
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: 11.0.x
    - name: Publish SQL Agent Job Deployment Tool
      shell: pwsh
      run: |
        dotnet publish SqlServerAgentJobDeploymentTool/SqlServerAgentJobDeploymentTool.csproj `
          --configuration Release `
          --runtime win-x64 `
          --self-contained true `
          --output SqlServerAgentJobDeploymentTool/publishOutput
    - name: Build Release Package (SQL Agent Job Deployment Tool)
      shell: pwsh
      run: |
        Compress-Archive `
          -Path SqlServerAgentJobDeploymentTool/publishOutput/* `
          -DestinationPath SqlServerAgentJobDeploymentTool/sqlagentjobdeploymenttool.zip `
          -Force
    - name: Upload the artifact (SQL Agent Job Deployment Tool)
      uses: actions/upload-artifact@v4
      with:
        name: sqlagentjobdeploymenttool
        path: SqlServerAgentJobDeploymentTool/sqlagentjobdeploymenttool.zip
    if: ${{ github.event_name == 'release' || inputs.component == 'all' || inputs.component == 'sql-agent-tool' }}
    env:
      RELEASE_VERSION: ${{ github.event_name == 'release' && github.event.release.tag_name || format('0.0.{0}', github.run_number) }}
  deploy-sql-agent-tool-staging:
    name: Deploy SQL Agent Job to Staging
    runs-on:
    - stagingserver
    - windows
    needs:
    - build-sql-agent-tool
    environment: staging
    steps:
    - name: Download SQL Agent Job Deployment Tool
      uses: actions/download-artifact@v4
      with:
        name: sqlagentjobdeploymenttool
        path: C:\txnproc\transactionprocessing\sqlagentjobdeploymenttool
    - name: Deploy SQL Agent Job
      shell: powershell
      run: |
        $toolRoot = 'C:\txnproc\transactionprocessing\sqlagentjobdeploymenttool'
        $configPath = 'C:\home\txnproc\config\sql-agent-jobs.local.json'
        New-Item -ItemType Directory -Path $toolRoot -Force | Out-Null
        Expand-Archive -Path (Join-Path $toolRoot 'sqlagentjobdeploymenttool.zip') -DestinationPath $toolRoot -Force
        $toolExe = Join-Path $toolRoot 'SqlServerAgentJobDeploymentTool.exe'
        $stdoutPath = Join-Path $env:RUNNER_TEMP 'sql-agent-job-deployment.stdout.log'
        $stderrPath = Join-Path $env:RUNNER_TEMP 'sql-agent-job-deployment.stderr.log'

        function Quote-Argument {
          param([string]$Value)
          '"' + ($Value -replace '"', '\"') + '"'
        }

        Remove-Item -LiteralPath $stdoutPath, $stderrPath -ErrorAction SilentlyContinue

        if (-not (Test-Path -LiteralPath $configPath)) {
          throw "Local SQL Agent job config not found: $configPath"
        }

        $arguments = @(
          '--manifest', $configPath
        ) | ForEach-Object { Quote-Argument $_ }

        $process = Start-Process `
          -FilePath $toolExe `
          -ArgumentList ($arguments -join ' ') `
          -Wait `
          -PassThru `
          -NoNewWindow `
          -RedirectStandardOutput $stdoutPath `
          -RedirectStandardError $stderrPath

        $exitCode = $process.ExitCode

        Write-Host "Captured SQL Agent job deployment exit code: $exitCode"

        if ($null -eq $exitCode) {
          throw "SQL Agent job deployment did not produce an exit code. Stdout: $stdoutPath. Stderr: $stderrPath."
        }

        if (Test-Path $stdoutPath) {
          Get-Content -LiteralPath $stdoutPath
        }

        if (Test-Path $stderrPath) {
          Get-Content -LiteralPath $stderrPath | ForEach-Object { Write-Error $_ }
        }

        Write-Host "SQL Agent job deployment exit code: $exitCode"

        if ($exitCode -ne 0) {
          throw "SQL Agent job deployment failed with exit code $exitCode. Stdout: $stdoutPath. Stderr: $stderrPath."
        }
    - name: Upload SQL Agent deployment logs on failure
      if: failure()
      uses: actions/upload-artifact@v4
      with:
        name: sql-agent-job-deployment-logs-staging
        path: |
          ${{ runner.temp }}\sql-agent-job-deployment.stdout.log
          ${{ runner.temp }}\sql-agent-job-deployment.stderr.log
