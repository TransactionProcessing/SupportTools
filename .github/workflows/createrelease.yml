# Publish a GitHub release to run all components, or use Run workflow to select one.
# Manual branch builds use version 0.0.<run_number>; NuGet publishing only occurs on stable GitHub releases.
name: Release - Independent Components
'on':
  release:
    types:
    - published
  workflow_dispatch:
    inputs:
      component:
        description: Component to build and deploy
        required: true
        type: choice
        default: all
        options:
        - all
        - merchant-pos
        - merchant-file-processor
        - scheduled-tasks
        - health-monitoring
        - sql-agent-tool
        - central-logging-forwarder
permissions:
  contents: read
jobs:
  build-merchant-pos:
    name: Build Merchant POS
    runs-on: ubuntu-latest
    env:
      ASPNETCORE_ENVIRONMENT: Production
      RELEASE_VERSION: ${{ github.event_name == 'release' && github.event.release.tag_name || format('0.0.{0}', github.run_number) }}
    steps:
    - uses: actions/checkout@v4
    - name: Install .NET 11
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: 11.0.x
    - name: Restore
      run: dotnet restore "TransactionProcessing.MerchantPos/TransactionProcessing.MerchantPos.sln" --source "${{ secrets.PUBLICFEEDURL }}" --source
        "${{ secrets.PRIVATEFEED_URL }}"
    - name: Build
      run: dotnet build "TransactionProcessing.MerchantPos/TransactionProcessing.MerchantPos.sln" --configuration Release --no-restore
    - name: Publish
      run: dotnet publish "TransactionProcessing.MerchantPos/TransactionProcessing.MerchantPos.csproj" --configuration Release --runtime win-x64
        --self-contained true --output "TransactionProcessing.MerchantPos/publishOutput" -p:Version=${{ env.RELEASE_VERSION }} -p:InformationalVersion=${{
        env.RELEASE_VERSION }}
    - name: Create ZIP
      run: cd "TransactionProcessing.MerchantPos/publishOutput" && zip -r "../merchantpos.zip" .
    - name: Upload artifact
      uses: actions/upload-artifact@v4
      with:
        name: merchantpos
        path: TransactionProcessing.MerchantPos/merchantpos.zip
        if-no-files-found: error
    if: ${{ github.event_name == 'release' || inputs.component == 'all' || inputs.component == 'merchant-pos' }}
  deploy-merchant-pos-staging:
    name: Deploy Merchant POS to Staging
    runs-on:
    - stagingserver
    - windows
    needs:
    - build-merchant-pos
    environment: staging
    steps:
    - name: Download artifact
      uses: actions/download-artifact@v4
      with:
        name: merchantpos
        path: ${{ runner.temp }}
    - name: Deploy Windows service
      shell: powershell
      run: |-
        $ErrorActionPreference = 'Stop'
        $serviceName = 'Transaction Processing - Merchant Pos'
        $target = 'C:\txnproc\transactionprocessing\merchantpos'
        $zip = Join-Path $env:RUNNER_TEMP 'merchantpos.zip'
        $existing = Get-Service -Name $serviceName -ErrorAction SilentlyContinue
        if ($existing) {
          if ($existing.Status -ne 'Stopped') { Stop-Service -Name $serviceName -Force }
          (Get-Service -Name $serviceName).WaitForStatus('Stopped', [TimeSpan]::FromSeconds(60))
        }
        New-Item -ItemType Directory -Path $target -Force | Out-Null
        Expand-Archive -LiteralPath $zip -DestinationPath $target -Force
        $exe = Join-Path $target 'TransactionProcessing.MerchantPos.exe'
        if (-not (Test-Path $exe)) { throw "Service executable missing: $exe" }
        if (-not $existing) {
          New-Service -Name $serviceName -BinaryPathName ('"' + $exe + '"') -DisplayName $serviceName -Description $serviceName -StartupType Automatic
        } else {
          sc.exe config $serviceName binPath= ('"' + $exe + '"') | Out-Host
          if ($LASTEXITCODE -ne 0) { throw 'Failed to update service path' }
        }
        Start-Service -Name $serviceName
        (Get-Service -Name $serviceName).WaitForStatus('Running', [TimeSpan]::FromSeconds(60))
