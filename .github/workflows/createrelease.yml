        run: |
          $taskScriptDir = 'C:\txnproc\transactionprocessing\powershell'
          $scheduledTasksDownloadRoot = Join-Path $env:RUNNER_TEMP 'scheduledtasks'
          $scheduledTasksRoot = Join-Path $scheduledTasksDownloadRoot 'ScheduledTasks'

          if (-not (Test-Path $scheduledTasksRoot)) {
