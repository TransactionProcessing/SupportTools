  deploy-central-logging-api-staging:
    name: Deploy Central Logging API and UI to Staging
    runs-on:
    - stagingserver
    - windows
    needs:
    - build-central-logging-api
    environment: staging
    steps:
    - name: Download API artifact
      uses: actions/download-artifact@v4
      with:
        name: centralloggingapi
        path: ${{ runner.temp }}
    - name: Deploy API Windows service
      shell: powershell
      env:
        CENTRAL_LOGGING_CONNECTION_STRING: ${{ secrets.CENTRAL_LOGGING_CONNECTION_STRING }}
        CENTRAL_LOGGING_API_KEY: ${{ secrets.CENTRAL_LOGGING_API_KEY }}
        CENTRAL_LOGGING_API_LISTEN_URLS: ${{ vars.CENTRAL_LOGGING_API_LISTEN_URLS }}
      run: |
        $ErrorActionPreference = 'Stop'
        if ([string]::IsNullOrWhiteSpace($env:CENTRAL_LOGGING_CONNECTION_STRING) -or [string]::IsNullOrWhiteSpace($env:CENTRAL_LOGGING_API_KEY)) { throw 'Configure CENTRAL_LOGGING_CONNECTION_STRING and CENTRAL_LOGGING_API_KEY in the staging environment.' }
        $serviceName = 'Central Logging API'
        $target = 'C:\txnproc\transactionprocessing\centralloggingapi'
        $existing = Get-Service -Name $serviceName -ErrorAction SilentlyContinue
        if ($existing -and $existing.Status -ne 'Stopped') { Stop-Service -Name $serviceName -Force; (Get-Service -Name $serviceName).WaitForStatus('Stopped', [TimeSpan]::FromSeconds(60)) }
        New-Item -ItemType Directory -Path $target -Force | Out-Null
        Expand-Archive -LiteralPath (Join-Path $env:RUNNER_TEMP 'centralloggingapi.zip') -DestinationPath $target -Force
        $exe = Join-Path $target 'CentralLogging.Api.exe'
        if (-not (Test-Path $exe)) { throw "API executable missing: $exe" }
        $settings = @{ ConnectionStrings = @{ CentralLogs = $env:CENTRAL_LOGGING_CONNECTION_STRING }; LogIngestion = @{ ApiKey = $env:CENTRAL_LOGGING_API_KEY; MaximumRequestBytes = 10485760; MaximumUploadBytes = 104857600; MaximumLineBytes = 1048576 }; LogRetention = @{ Enabled = $false; RetentionDays = 90; BatchSize = 1000; IntervalMinutes = 60 }; Logging = @{ LogLevel = @{ Default = 'Information'; 'Microsoft.AspNetCore' = 'Warning' } }; AllowedHosts = '*'; Urls = $(if ([string]::IsNullOrWhiteSpace($env:CENTRAL_LOGGING_API_LISTEN_URLS)) { 'http://127.0.0.1:7100' } else { $env:CENTRAL_LOGGING_API_LISTEN_URLS }) }
        $settings | ConvertTo-Json -Depth 6 | Set-Content -LiteralPath (Join-Path $target 'appsettings.json') -Encoding utf8
        if (-not $existing) { New-Service -Name $serviceName -BinaryPathName ('"' + $exe + '"') -DisplayName $serviceName -Description 'Central Logging API and browser UI' -StartupType Automatic | Out-Null }
        else { sc.exe config $serviceName binPath= ('"' + $exe + '"') start= auto | Out-Host; if ($LASTEXITCODE -ne 0) { throw 'Failed to update API service path.' } }
        Start-Service -Name $serviceName
        (Get-Service -Name $serviceName).WaitForStatus('Running', [TimeSpan]::FromSeconds(60))
  deploy-central-logging-forwarder-staging:
    name: Deploy Central Logging Forwarder to Staging
    runs-on:
    - stagingserver
    - windows
    needs:
    - build-central-logging-forwarder
    - deploy-central-logging-api-staging
    environment: staging
    steps:
    - name: Download artifact
      uses: actions/download-artifact@v4
      with:
        name: centralloggingforwarder
        path: ${{ runner.temp }}
    - name: Deploy Windows service
      shell: powershell
      env:
        CENTRAL_LOGGING_ENDPOINT: ${{ vars.CENTRAL_LOGGING_ENDPOINT }}
        CENTRAL_LOGGING_SOURCE_DIRECTORIES: ${{ vars.CENTRAL_LOGGING_SOURCE_DIRECTORIES }}
        CENTRAL_LOGGING_API_KEY: ${{ secrets.CENTRAL_LOGGING_API_KEY }}
      run: |
        $ErrorActionPreference = 'Stop'
        $serviceName = 'Central Logging Forwarder'
        $target = 'C:\txnproc\transactionprocessing\centralloggingforwarder'
        if ([string]::IsNullOrWhiteSpace($env:CENTRAL_LOGGING_ENDPOINT) -or [string]::IsNullOrWhiteSpace($env:CENTRAL_LOGGING_API_KEY)) { throw 'Configure CENTRAL_LOGGING_ENDPOINT and CENTRAL_LOGGING_API_KEY in the staging environment.' }
        if ([string]::IsNullOrWhiteSpace($env:CENTRAL_LOGGING_SOURCE_DIRECTORIES)) { throw 'Configure CENTRAL_LOGGING_SOURCE_DIRECTORIES as a JSON array in the staging environment.' }
        try { $sourceDirectories = @(ConvertFrom-Json -InputObject $env:CENTRAL_LOGGING_SOURCE_DIRECTORIES -ErrorAction Stop) } catch { throw 'CENTRAL_LOGGING_SOURCE_DIRECTORIES must be a JSON array of directory paths.' }
        if ($sourceDirectories.Count -eq 0 -or @($sourceDirectories | Where-Object { [string]::IsNullOrWhiteSpace([string]$_) }).Count -gt 0) { throw 'CENTRAL_LOGGING_SOURCE_DIRECTORIES must contain at least one non-empty directory path.' }
        $existing = Get-Service -Name $serviceName -ErrorAction SilentlyContinue
        if ($existing -and $existing.Status -ne 'Stopped') { Stop-Service -Name $serviceName -Force }
        if ($existing) { (Get-Service -Name $serviceName).WaitForStatus('Stopped', [TimeSpan]::FromSeconds(60)) }
        New-Item -ItemType Directory -Path $target -Force | Out-Null
        Expand-Archive -LiteralPath (Join-Path $env:RUNNER_TEMP 'centralloggingforwarder.zip') -DestinationPath $target -Force
        $exe = Join-Path $target 'CentralLogging.Forwarder.exe'
        if (-not (Test-Path $exe)) { throw "Service executable missing: $exe" }
        $programData = 'C:\ProgramData\CentralLogging'
        New-Item -ItemType Directory -Path $programData -Force | Out-Null
        $configRoot = 'C:\home\txnproc\config'
        New-Item -ItemType Directory -Path $configRoot -Force | Out-Null
        $localSettingsPath = Join-Path $configRoot 'appsettings.local.json'
        $localSettings = if (Test-Path -LiteralPath $localSettingsPath) { Get-Content -LiteralPath $localSettingsPath -Raw | ConvertFrom-Json } else { [pscustomobject]@{} }
        $localSettings | Add-Member -NotePropertyName LogForwarder -NotePropertyValue @{ SourceDirectories = @($sourceDirectories); FilePatterns = @('structured-logger-*.json*'); IncludeSubdirectories = $false; Endpoint = $env:CENTRAL_LOGGING_ENDPOINT; ApiKey = $env:CENTRAL_LOGGING_API_KEY; CheckpointPath = (Join-Path $programData 'forwarder-checkpoint.json'); BatchSize = 100; PollIntervalSeconds = 5 } -Force
        $localSettings | ConvertTo-Json -Depth 10 | Set-Content -LiteralPath $localSettingsPath -Encoding utf8
        if (-not $existing) { New-Service -Name $serviceName -BinaryPathName ('"' + $exe + '"') -DisplayName $serviceName -Description 'Forwards shared application logs to Central Logging' -StartupType Automatic | Out-Null }
        else { sc.exe config $serviceName binPath= ('"' + $exe + '"') start= auto | Out-Host; if ($LASTEXITCODE -ne 0) { throw 'Failed to update service path.' } }
        Start-Service -Name $serviceName
        (Get-Service -Name $serviceName).WaitForStatus('Running', [TimeSpan]::FromSeconds(60))
