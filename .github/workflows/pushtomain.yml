name: Push to Main - Development
on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      component:
        description: Component to deploy
        required: true
        type: choice
        default: all
        options: [all, merchant-pos, merchant-file-processor, scheduled-tasks, health-monitoring, sql-agent-tool, central-logging-forwarder]
permissions:
  contents: read
jobs:
  build-merchant-pos:
    name: Build Merchant POS
    if: ${{ github.event_name == 'push' || inputs.component == 'all' || inputs.component == 'merchant-pos' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '11.0.x'
      - name: Restore
        run: dotnet restore "TransactionProcessing.MerchantPos/TransactionProcessing.MerchantPos.sln" --source "${{ secrets.PUBLICFEEDURL }}" --source "${{ secrets.PRIVATEFEED_URL }}"
      - name: Build
        run: dotnet build "TransactionProcessing.MerchantPos/TransactionProcessing.MerchantPos.sln" -c Release --no-restore
      - name: Publish
        run: dotnet publish "TransactionProcessing.MerchantPos/TransactionProcessing.MerchantPos.csproj" -c Release -r win-x64 --self-contained true -o "publish/merchant-pos" -p:Version=0.0.${{ github.run_number }} -p:AssemblyVersion=0.0.${{ github.run_number }} -p:FileVersion=0.0.${{ github.run_number }} -p:InformationalVersion=0.0.${{ github.run_number }}
      - name: Archive
        shell: bash
        run: cd publish/merchant-pos && zip -r ../../merchantpos.zip .
      - uses: actions/upload-artifact@v4
        with:
          name: merchantpos
          path: merchantpos.zip
          if-no-files-found: error
  build-merchant-file-processor:
    name: Build Merchant File Processor
    if: ${{ github.event_name == 'push' || inputs.component == 'all' || inputs.component == 'merchant-file-processor' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '11.0.x'
      - name: Restore
        run: dotnet restore "TransactionProcessing.MerchantFileProcessor/TransactionProcessing.MerchantFileProcessor.sln" --source "${{ secrets.PUBLICFEEDURL }}" --source "${{ secrets.PRIVATEFEED_URL }}"
      - name: Build
        run: dotnet build "TransactionProcessing.MerchantFileProcessor/TransactionProcessing.MerchantFileProcessor.sln" -c Release --no-restore
      - name: Publish
        run: dotnet publish "TransactionProcessing.MerchantFileProcessor/TransactionProcessing.MerchantFileProcessor.csproj" -c Release -r win-x64 --self-contained true -o "publish/merchant-file-processor" -p:Version=0.0.${{ github.run_number }} -p:AssemblyVersion=0.0.${{ github.run_number }} -p:FileVersion=0.0.${{ github.run_number }} -p:InformationalVersion=0.0.${{ github.run_number }}
      - name: Archive
        shell: bash
        run: cd publish/merchant-file-processor && zip -r ../../merchantfileprocessor.zip .
      - uses: actions/upload-artifact@v4
        with:
          name: merchantfileprocessor
          path: merchantfileprocessor.zip
          if-no-files-found: error
  build-scheduled-tasks:
    name: Build ScheduledTasks
    if: ${{ github.event_name == 'push' || inputs.component == 'all' || inputs.component == 'scheduled-tasks' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '11.0.x'
      - name: Publish KurrentDB client
        run: dotnet publish ScheduledTasks/DailySupportCheck/KurrentDbClient/KurrentDbClient.csproj -c Release --no-self-contained -o ScheduledTasks/DailySupportCheck/KurrentDbClient/publishOutput
      - name: Download PowerShell
        run: curl --fail --location --silent --show-error --retry 3 --output ScheduledTasks/PowerShell-7.7.0-win-x64.zip https://github.com/PowerShell/PowerShell/releases/download/v7.7.0/PowerShell-7.7.0-win-x64.zip
      - uses: actions/upload-artifact@v4
        with:
          name: scheduledtasks
          path: ScheduledTasks
          if-no-files-found: error
  build-health-monitoring:
    name: Build Health Monitoring
    if: ${{ github.event_name == 'push' || inputs.component == 'all' || inputs.component == 'health-monitoring' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '11.0.x'
      - name: Restore
        run: dotnet restore "HealthMonitoring/HealthMonitoring/HealthMonitoring.sln" --source "${{ secrets.PUBLICFEEDURL }}" --source "${{ secrets.PRIVATEFEED_URL }}"
      - name: Build
        run: dotnet build "HealthMonitoring/HealthMonitoring/HealthMonitoring.sln" -c Release --no-restore
      - name: Publish
        run: dotnet publish "HealthMonitoring/HealthMonitoring/HealthMonitoring.csproj" -c Release -r win-x64 --self-contained true -o "publish/health-monitoring" -p:Version=0.0.${{ github.run_number }} -p:AssemblyVersion=0.0.${{ github.run_number }} -p:FileVersion=0.0.${{ github.run_number }} -p:InformationalVersion=0.0.${{ github.run_number }}
      - name: Archive
        shell: bash
        run: cd publish/health-monitoring && zip -r ../../healthmonitoring.zip .
      - uses: actions/upload-artifact@v4
        with:
          name: healthmonitoring
          path: healthmonitoring.zip
          if-no-files-found: error
      - name: Publish NuGet client
        env:
          PRIVATEFEED_APIKEY: ${{ secrets.PRIVATEFEED_APIKEY }}
          PRIVATEFEED_URL: ${{ secrets.PRIVATEFEED_URL }}
        run: |
          dotnet pack HealthMonitoring/HealthMonitoring.Client/HealthMonitoring.Client.csproj -c Release -p:PackageVersion=0.0.${{ github.run_number }} --output Nugets
          dotnet nuget push Nugets/HealthMonitoring.Client.0.0.${{ github.run_number }}.nupkg --api-key "$PRIVATEFEED_APIKEY" --source "$PRIVATEFEED_URL" --skip-duplicate
  build-sql-agent-tool:
    name: Build SQL Agent Job Deployment Tool
    if: ${{ github.event_name == 'push' || inputs.component == 'all' || inputs.component == 'sql-agent-tool' }}
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '11.0.x'
      - name: Publish
        run: dotnet publish "SqlServerAgentJobDeploymentTool/SqlServerAgentJobDeploymentTool.csproj" -c Release -r win-x64 --self-contained true -o "publish/sql-agent-tool" 
      - name: Archive
        shell: pwsh
        run: Compress-Archive -Path publish/sql-agent-tool/* -DestinationPath sqlagentjobdeploymenttool.zip -Force
      - uses: actions/upload-artifact@v4
        with:
          name: sqlagentjobdeploymenttool
          path: sqlagentjobdeploymenttool.zip
          if-no-files-found: error
  build-central-logging-forwarder:
    name: Build Central Logging Forwarder
    if: ${{ github.event_name == 'push' || inputs.component == 'all' || inputs.component == 'central-logging-forwarder' }}
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '11.0.x'
      - name: Restore
        run: dotnet restore CentralLogging.Forwarder/CentralLogging.Forwarder.csproj --source "${{ secrets.PUBLICFEEDURL }}" --source "${{ secrets.PRIVATEFEED_URL }}"
      - name: Publish Windows service
        run: dotnet publish CentralLogging.Forwarder/CentralLogging.Forwarder.csproj -c Release -r win-x64 --self-contained true -o publish/central-logging-forwarder -p:Version=0.0.${{ github.run_number }} -p:AssemblyVersion=0.0.${{ github.run_number }} -p:FileVersion=0.0.${{ github.run_number }} -p:InformationalVersion=0.0.${{ github.run_number }}
      - name: Archive
        shell: pwsh
        run: Compress-Archive -Path publish/central-logging-forwarder/* -DestinationPath centralloggingforwarder.zip -Force
      - uses: actions/upload-artifact@v4
        with:
          name: centralloggingforwarder
          path: centralloggingforwarder.zip
          if-no-files-found: error
  build-central-logging-api:
    name: Build Central Logging API and UI
    if: ${{ github.event_name == 'push' || inputs.component == 'all' || inputs.component == 'central-logging-forwarder' }}
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '11.0.x'
      - name: Restore
        run: dotnet restore CentralLogging.Api/CentralLogging.Api.csproj --source "${{ secrets.PUBLICFEEDURL }}" --source "${{ secrets.PRIVATEFEED_URL }}"
      - name: Publish Windows service
        run: dotnet publish CentralLogging.Api/CentralLogging.Api.csproj -c Release -r win-x64 --self-contained true -o publish/central-logging-api -p:Version=0.0.${{ github.run_number }} -p:AssemblyVersion=0.0.${{ github.run_number }} -p:FileVersion=0.0.${{ github.run_number }} -p:InformationalVersion=0.0.${{ github.run_number }}
      - name: Archive
        shell: pwsh
        run: Compress-Archive -Path publish/central-logging-api/* -DestinationPath centralloggingapi.zip -Force
      - uses: actions/upload-artifact@v4
        with:
          name: centralloggingapi
          path: centralloggingapi.zip
          if-no-files-found: error
  deploy-merchant-pos-development:
    name: Deploy Merchant POS to Development
    if: ${{ github.event_name == 'push' || inputs.component == 'all' || inputs.component == 'merchant-pos' }}
    needs: [build-merchant-pos]
    runs-on: [developmentserver, windows]
    environment: development
    concurrency:
      group: supporttools-development
      cancel-in-progress: false
      queue: max
    steps:
      - name: Download the artifact (Merchant Pos) 
        uses: actions/download-artifact@v4.1.8
        with:
          name: merchantpos
          
      - name: Stop existing Windows service
        shell: pwsh
        run: |
          $serviceName = "Transaction Processing - Merchant Pos"
          $service = Get-Service -Name $serviceName -ErrorAction SilentlyContinue
          if ($service -and $service.Status -ne 'Stopped') {
            Stop-Service -Name $serviceName -Force
            (Get-Service -Name $serviceName).WaitForStatus('Stopped', '00:00:30')
          }

      - name: Unzip the files (Merchant Pos)
        run: |
          Expand-Archive -Path merchantpos.zip -DestinationPath "C:\txnproc\transactionprocessing\merchantpos" -Force
  
      - name: Install as a Windows service (Merchant Pos)
        run: |
          $serviceName = "Transaction Processing - Merchant Pos"
          $servicePath = "C:\txnproc\transactionprocessing\merchantpos\TransactionProcessing.MerchantPos.exe"
                   
          if (-not (Get-Service -Name $serviceName -ErrorAction SilentlyContinue)) {
            New-Service -Name $serviceName -BinaryPathName $servicePath -Description $serviceName -DisplayName $serviceName -StartupType Automatic
          }
          Start-Service -Name $serviceName
  deploy-merchant-file-processor-development:
    name: Deploy Merchant File Processor to Development
    if: ${{ github.event_name == 'push' || inputs.component == 'all' || inputs.component == 'merchant-file-processor' }}
    needs: [build-merchant-file-processor]
    runs-on: [developmentserver, windows]
    environment: development
    concurrency:
      group: supporttools-development
      cancel-in-progress: false
      queue: max
    steps:
      - name: Download the artifact (Merchant File Processor) 
        uses: actions/download-artifact@v4.1.8
        with:
          name: merchantfileprocessor

      - name: Stop existing Windows service
        shell: pwsh
        run: |
          $serviceName = "Transaction Processing - Merchant File Processor"
          $service = Get-Service -Name $serviceName -ErrorAction SilentlyContinue
          if ($service -and $service.Status -ne 'Stopped') {
            Stop-Service -Name $serviceName -Force
            (Get-Service -Name $serviceName).WaitForStatus('Stopped', '00:00:30')
          }

      - name: Unzip the files (Merchant File Processor)
        run: |
          Expand-Archive -Path merchantfileprocessor.zip -DestinationPath "C:\txnproc\transactionprocessing\merchantfileprocessor" -Force
  
      - name: Install as a Windows service (Merchant File Processor)
        run: |
          $serviceName = "Transaction Processing - Merchant File Processor"
          $servicePath = "C:\txnproc\transactionprocessing\merchantfileprocessor\TransactionProcessing.MerchantFileProcessor.exe"
                   
          if (-not (Get-Service -Name $serviceName -ErrorAction SilentlyContinue)) {
            New-Service -Name $serviceName -BinaryPathName $servicePath -Description $serviceName -DisplayName $serviceName -StartupType Automatic
          }
          Start-Service -Name $serviceName
  deploy-scheduled-tasks-development:
    name: Deploy ScheduledTasks to Development
    if: ${{ github.event_name == 'push' || inputs.component == 'all' || inputs.component == 'scheduled-tasks' }}
    needs: [build-scheduled-tasks]
    runs-on: [developmentserver, windows]
    environment: development
    concurrency:
      group: supporttools-development
      cancel-in-progress: false
      queue: max
    steps:
      - name: Download ScheduledTasks
        uses: actions/download-artifact@v4.1.8
        with:
          name: scheduledtasks
          path: ${{ runner.temp }}\scheduledtasks

      - name: Install scheduled tasks
        shell: powershell
        env:
          SCHEDULED_TASK_USER: ${{ secrets.SCHEDULED_TASK_USER }}
          SCHEDULED_TASK_PASSWORD: ${{ secrets.SCHEDULED_TASK_PASSWORD }}
        run: |
          $taskScriptDir = 'C:\txnproc\transactionprocessing\powershell'
          $scheduledTasksDownloadRoot = Join-Path $env:RUNNER_TEMP 'scheduledtasks'
          $scheduledTasksRoot = Join-Path $scheduledTasksDownloadRoot 'ScheduledTasks'

          if (-not (Test-Path $scheduledTasksRoot)) {
            $scheduledTasksRoot = $scheduledTasksDownloadRoot
          }

          & (Join-Path $scheduledTasksRoot 'Install-ScheduledTaskPowerShell.ps1')

          New-Item -ItemType Directory -Path $taskScriptDir -Force | Out-Null

          Get-ChildItem -Path $scheduledTasksRoot -Recurse -Filter *.ps1 |
            Where-Object { $_.FullName -notmatch '\\Tests\\' -and $_.Name -ne 'Install-ScheduledTaskPowerShell.ps1' } |
            Copy-Item -Destination $taskScriptDir -Force

          Get-ChildItem -Path $scheduledTasksRoot -Recurse -Filter daily-support-check.json |
            Where-Object { $_.FullName -notmatch '\\Reports\\|\\Tests\\' } |
            Copy-Item -Destination $taskScriptDir -Force

          $kurrentDbClientOutput = Get-ChildItem -Path $scheduledTasksRoot -Recurse -Directory -Filter publishOutput |
            Where-Object { $_.FullName -match '\\DailySupportCheck\\KurrentDbClient\\publishOutput$' } |
            Select-Object -First 1
          if (-not $kurrentDbClientOutput) {
            throw 'Packaged KurrentDB client output was not found in the scheduled-tasks artifact.'
          }
          $kurrentDbClientDestination = Join-Path $taskScriptDir 'KurrentDbClient'
          New-Item -ItemType Directory -Path $kurrentDbClientDestination -Force | Out-Null
          Copy-Item -Path (Join-Path $kurrentDbClientOutput.FullName '*') -Destination $kurrentDbClientDestination -Recurse -Force

          Get-ChildItem -Path $scheduledTasksRoot -Recurse -Filter *.xml |
            Where-Object { $_.FullName -notmatch '\\Tests\\' } |
            ForEach-Object {
              [xml]$taskDefinition = Get-Content -Path $_.FullName -Raw
              $taskName = [string]$taskDefinition.Task.RegistrationInfo.URI

              if ([string]::IsNullOrWhiteSpace($taskName)) {
                $taskName = $_.BaseName
              }

              $taskName = $taskName.TrimStart('\')
              & schtasks.exe /Create /TN $taskName /XML $_.FullName /RU SYSTEM /F
              if ($LASTEXITCODE -ne 0) {
                throw "Failed to register scheduled task [$taskName] from [$($_.FullName)]"
              }
            }
  deploy-health-monitoring-development:
    name: Deploy Health Monitoring to Development
    if: ${{ github.event_name == 'push' || inputs.component == 'all' || inputs.component == 'health-monitoring' }}
    needs: [build-health-monitoring]
    runs-on: [developmentserver, windows]
    environment: development
    concurrency:
      group: supporttools-development
      cancel-in-progress: false
      queue: max
    steps:
      - name: Download the artifact (Health Monitoring) 
        uses: actions/download-artifact@v4.1.8
        with:
          name: healthmonitoring
          
      - name: Stop existing Windows service
        shell: pwsh
        run: |
          $serviceName = "Transaction Processing - Health Monitoring"
          $service = Get-Service -Name $serviceName -ErrorAction SilentlyContinue
          if ($service -and $service.Status -ne 'Stopped') {
            Stop-Service -Name $serviceName -Force
            (Get-Service -Name $serviceName).WaitForStatus('Stopped', '00:00:30')
          }

      - name: Unzip the files (Health Monitoring)
        run: |
          Expand-Archive -Path healthmonitoring.zip -DestinationPath "C:\txnproc\transactionprocessing\healthmonitoring" -Force
  
      - name: Install as a Windows service (Health Monitoring)
        run: |
          $serviceName = "Transaction Processing - Health Monitoring"
          $servicePath = "C:\txnproc\transactionprocessing\healthmonitoring\HealthMonitoring.exe"
                   
          if (-not (Get-Service -Name $serviceName -ErrorAction SilentlyContinue)) {
            New-Service -Name $serviceName -BinaryPathName $servicePath -Description $serviceName -DisplayName $serviceName -StartupType Automatic
          }
          Start-Service -Name $serviceName
  deploy-sql-agent-tool-development:
    name: Deploy SQL Agent Job Deployment Tool to Development
    if: ${{ github.event_name == 'push' || inputs.component == 'all' || inputs.component == 'sql-agent-tool' }}
    needs: [build-sql-agent-tool]
    runs-on: [developmentserver, windows]
    environment: development
    concurrency:
      group: supporttools-development
      cancel-in-progress: false
      queue: max
    steps:
      - name: Download SQL Agent Job Deployment Tool
        uses: actions/download-artifact@v4.1.8
        with:
          name: sqlagentjobdeploymenttool
          path: C:\txnproc\transactionprocessing\sqlagentjobdeploymenttool

      - name: Deploy SQL Agent Job
        shell: powershell
        run: |
          $toolRoot = 'C:\txnproc\transactionprocessing\sqlagentjobdeploymenttool'
          $configPath = 'C:\home\txnproc\config\sql-agent-jobs.local.json'
          New-Item -ItemType Directory -Path $toolRoot -Force | Out-Null
          Expand-Archive -Path (Join-Path $toolRoot 'sqlagentjobdeploymenttool.zip') -DestinationPath $toolRoot -Force
          $toolExe = Join-Path $toolRoot 'SqlServerAgentJobDeploymentTool.exe'
          $stdoutPath = Join-Path $env:RUNNER_TEMP 'sql-agent-job-deployment.stdout.log'
          $stderrPath = Join-Path $env:RUNNER_TEMP 'sql-agent-job-deployment.stderr.log'

          function Quote-Argument {
            param([string]$Value)
            '"' + ($Value -replace '"', '\"') + '"'
          }

          Remove-Item -LiteralPath $stdoutPath, $stderrPath -ErrorAction SilentlyContinue

          if (-not (Test-Path -LiteralPath $configPath)) {
            throw "Local SQL Agent job config not found: $configPath"
          }

          $arguments = @(
            '--manifest', $configPath
          ) | ForEach-Object { Quote-Argument $_ }

          $process = Start-Process `
            -FilePath $toolExe `
            -ArgumentList ($arguments -join ' ') `
            -Wait `
            -PassThru `
            -NoNewWindow `
            -RedirectStandardOutput $stdoutPath `
            -RedirectStandardError $stderrPath

          $exitCode = $process.ExitCode

          Write-Host "Captured SQL Agent job deployment exit code: $exitCode"

          if ($null -eq $exitCode) {
            throw "SQL Agent job deployment did not produce an exit code. Stdout: $stdoutPath. Stderr: $stderrPath."
          }

          if (Test-Path $stdoutPath) {
            Get-Content -LiteralPath $stdoutPath
          }

          if (Test-Path $stderrPath) {
            Get-Content -LiteralPath $stderrPath | ForEach-Object { Write-Error $_ }
          }

          Write-Host "SQL Agent job deployment exit code: $exitCode"

          if ($exitCode -ne 0) {
            throw "SQL Agent job deployment failed with exit code $exitCode. Stdout: $stdoutPath. Stderr: $stderrPath."
          }

      - name: Upload SQL Agent deployment logs on failure
        if: failure()
        uses: actions/upload-artifact@v4.4.0
        with:
          name: sql-agent-job-deployment-logs-development
          path: |
            ${{ runner.temp }}\sql-agent-job-deployment.stdout.log
            ${{ runner.temp }}\sql-agent-job-deployment.stderr.log
  deploy-central-logging-forwarder-development:
    name: Deploy Central Logging Forwarder to Development
    if: ${{ github.event_name == 'push' || inputs.component == 'all' || inputs.component == 'central-logging-forwarder' }}
    needs: [build-central-logging-forwarder, deploy-central-logging-api-development]
    runs-on: [developmentserver, windows]
    environment: development
    concurrency:
      group: supporttools-development
      cancel-in-progress: false
      queue: max
    steps:
      - name: Download Central Logging Forwarder
        uses: actions/download-artifact@v4.1.8
        with:
          name: centralloggingforwarder
      - name: Stop existing Windows service
        shell: pwsh
        run: |
          $serviceName = 'Central Logging Forwarder'
          $service = Get-Service -Name $serviceName -ErrorAction SilentlyContinue
          if ($service -and $service.Status -ne 'Stopped') {
            Stop-Service -Name $serviceName -Force
            (Get-Service -Name $serviceName).WaitForStatus('Stopped', '00:00:30')
          }
      - name: Install and start Central Logging Forwarder
        shell: pwsh
        env:
          CENTRAL_LOGGING_ENDPOINT: ${{ vars.CENTRAL_LOGGING_ENDPOINT }}
          CENTRAL_LOGGING_SOURCE_DIRECTORIES: ${{ vars.CENTRAL_LOGGING_SOURCE_DIRECTORIES }}
          CENTRAL_LOGGING_API_KEY: ${{ secrets.CENTRAL_LOGGING_API_KEY }}
        run: |
          $ErrorActionPreference = 'Stop'
          $serviceName = 'Central Logging Forwarder'
          $serviceRoot = 'C:\txnproc\transactionprocessing\centralloggingforwarder'
          $servicePath = Join-Path $serviceRoot 'CentralLogging.Forwarder.exe'
          if ([string]::IsNullOrWhiteSpace($env:CENTRAL_LOGGING_ENDPOINT)) {
            throw 'Set the development environment variable CENTRAL_LOGGING_ENDPOINT.'
          }
          if ([string]::IsNullOrWhiteSpace($env:CENTRAL_LOGGING_API_KEY)) {
            throw 'Set the development secret CENTRAL_LOGGING_API_KEY.'
          }
          if ([string]::IsNullOrWhiteSpace($env:CENTRAL_LOGGING_SOURCE_DIRECTORIES)) {
            throw 'Set CENTRAL_LOGGING_SOURCE_DIRECTORIES as a JSON array in the development environment, for example ["C:\\services\\app\\logs\\shared"].'
          }
          try {
            $sourceDirectories = @(ConvertFrom-Json -InputObject $env:CENTRAL_LOGGING_SOURCE_DIRECTORIES -ErrorAction Stop)
          } catch {
            throw 'CENTRAL_LOGGING_SOURCE_DIRECTORIES must be a JSON array of directory paths.'
          }
          if ($sourceDirectories.Count -eq 0 -or @($sourceDirectories | Where-Object { [string]::IsNullOrWhiteSpace([string]$_) }).Count -gt 0) {
            throw 'CENTRAL_LOGGING_SOURCE_DIRECTORIES must contain at least one non-empty directory path.'
          }
          New-Item -ItemType Directory -Path $serviceRoot -Force | Out-Null
          Expand-Archive -Path centralloggingforwarder.zip -DestinationPath $serviceRoot -Force
          $settings = @{
            LogForwarder = @{
              SourceDirectories = @($sourceDirectories)
              FilePatterns = @('structured-logger-*.json*')
              IncludeSubdirectories = $false
              Endpoint = $env:CENTRAL_LOGGING_ENDPOINT
              ApiKey = $env:CENTRAL_LOGGING_API_KEY
              CheckpointPath = 'C:\ProgramData\CentralLogging\forwarder-checkpoint.json'
              BatchSize = 100
              PollIntervalSeconds = 5
            }
          }
          $programData = 'C:\ProgramData\CentralLogging'
          New-Item -ItemType Directory -Path $programData -Force | Out-Null
          $configRoot = 'C:\home\txnproc\config'
          New-Item -ItemType Directory -Path $configRoot -Force | Out-Null
          $localSettingsPath = Join-Path $configRoot 'appsettings.local.json'
          $localSettings = if (Test-Path -LiteralPath $localSettingsPath) { Get-Content -LiteralPath $localSettingsPath -Raw | ConvertFrom-Json } else { [pscustomobject]@{} }
          $localSettings | Add-Member -NotePropertyName LogForwarder -NotePropertyValue $settings.LogForwarder -Force
          $localSettings | ConvertTo-Json -Depth 10 | Set-Content -LiteralPath $localSettingsPath -Encoding utf8
          $service = Get-Service -Name $serviceName -ErrorAction SilentlyContinue
          if (-not $service) {
            New-Service -Name $serviceName -BinaryPathName ('"' + $servicePath + '"') -Description 'Forwards shared application logs to Central Logging' -DisplayName $serviceName -StartupType Automatic | Out-Null
          } else {
            & sc.exe config $serviceName "binPath= `"$servicePath`"" start= auto | Out-Null
            if ($LASTEXITCODE -ne 0) { throw 'Failed to update the Central Logging Forwarder service executable path.' }
            Set-Service -Name $serviceName -StartupType Automatic
          }
          Start-Service -Name $serviceName
  deploy-central-logging-api-development:
    name: Deploy Central Logging API and UI to Development
    if: ${{ github.event_name == 'push' || inputs.component == 'all' || inputs.component == 'central-logging-forwarder' }}
    needs: [build-central-logging-api]
    runs-on: [developmentserver, windows]
    environment: development
    concurrency:
      group: supporttools-development
      cancel-in-progress: false
      queue: max
    steps:
      - name: Download Central Logging API
        uses: actions/download-artifact@v4.1.8
        with:
          name: centralloggingapi
      - name: Deploy API Windows service
        shell: pwsh
        env:
          CENTRAL_LOGGING_CONNECTION_STRING: ${{ secrets.CENTRAL_LOGGING_CONNECTION_STRING }}
          CENTRAL_LOGGING_API_KEY: ${{ secrets.CENTRAL_LOGGING_API_KEY }}
          CENTRAL_LOGGING_API_LISTEN_URLS: ${{ vars.CENTRAL_LOGGING_API_LISTEN_URLS }}
        run: |
          $ErrorActionPreference = 'Stop'
          if ([string]::IsNullOrWhiteSpace($env:CENTRAL_LOGGING_API_KEY)) { throw 'Set the development secret CENTRAL_LOGGING_API_KEY.' }
          $serviceName = 'Central Logging API'
          $serviceRoot = 'C:\txnproc\transactionprocessing\centralloggingapi'
          $servicePath = Join-Path $serviceRoot 'CentralLogging.Api.exe'
          $service = Get-Service -Name $serviceName -ErrorAction SilentlyContinue
          if ($service -and $service.Status -ne 'Stopped') { Stop-Service -Name $serviceName -Force; (Get-Service -Name $serviceName).WaitForStatus('Stopped', [TimeSpan]::FromSeconds(60)) }
          New-Item -ItemType Directory -Path $serviceRoot -Force | Out-Null
          Expand-Archive -Path centralloggingapi.zip -DestinationPath $serviceRoot -Force
          $settings = @{
            LogIngestion = @{ ApiKey = $env:CENTRAL_LOGGING_API_KEY; MaximumRequestBytes = 10485760; MaximumUploadBytes = 104857600; MaximumLineBytes = 1048576 }
            LogRetention = @{ Enabled = $false; RetentionDays = 90; BatchSize = 1000; IntervalMinutes = 60 }
            Logging = @{ LogLevel = @{ Default = 'Information'; 'Microsoft.AspNetCore' = 'Warning' } }
            AllowedHosts = '*'
            Urls = $(if ([string]::IsNullOrWhiteSpace($env:CENTRAL_LOGGING_API_LISTEN_URLS)) { 'http://127.0.0.1:7100' } else { $env:CENTRAL_LOGGING_API_LISTEN_URLS })
          }
          if (-not [string]::IsNullOrWhiteSpace($env:CENTRAL_LOGGING_CONNECTION_STRING)) {
            $settings.ConnectionStrings = @{ CentralLogs = $env:CENTRAL_LOGGING_CONNECTION_STRING }
          }
          $settings | ConvertTo-Json -Depth 6 | Set-Content -LiteralPath (Join-Path $serviceRoot 'appsettings.json') -Encoding utf8
          if (-not $service) { New-Service -Name $serviceName -BinaryPathName ('"' + $servicePath + '"') -DisplayName $serviceName -Description 'Central Logging API and browser UI' -StartupType Automatic | Out-Null }
          else { sc.exe config $serviceName binPath= ('"' + $servicePath + '"') start= auto | Out-Host; if ($LASTEXITCODE -ne 0) { throw 'Failed to update API service path.' } }
          Start-Service -Name $serviceName
          (Get-Service -Name $serviceName).WaitForStatus('Running', [TimeSpan]::FromSeconds(60))
